[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "settledrift"
version = "0.1.0"
description = "Reconciles a merchant ledger against a settlement report, resolves what it's sure of, and never guesses on the rest."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ayon Aryan" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
settledrift = "settledrift.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
